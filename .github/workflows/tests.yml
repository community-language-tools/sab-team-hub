name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pester:
    name: Pester on Windows PowerShell 5.1
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 6.1.0 -Force -Scope CurrentUser
          $v = (Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1).Version
          Write-Host "[INFO] Pester $v"

      - name: Run the test suite
        shell: powershell
        run: .\tests\Invoke-Tests.ps1 -RepoRoot '.' -ResultsPath 'test-results.xml'

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: warn
